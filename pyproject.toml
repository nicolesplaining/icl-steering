[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icl-steering"
version = "0.1.0"
description = "Test whether activation differences transfer mathematical methods from demonstrations."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers==4.51.3",
  "accelerate==1.6.0",
  "numpy==1.24.4",
  "jinja2==3.1.6",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
icl-steering = "icl_steering.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
